# DataSource Config
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: root
    password: test
  sql:
    init:
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
      mode: always

mybatis-plus:
  mapper-locations: classpath:mapper/**/*Mapper.xml
  global-config:
    banner: false

# Mybatis Mate 配置
mybatis-mate:
  cert:
    # 请添加微信wx153666购买授权，不白嫖从我做起！ 测试证书会失效，请勿正式环境使用
    grant: dGhpc0lzVGVzdExpY2Vuc2Uj5byg5LiJ
    license: 

# Logger Config
logging:
  level:
    mybatis.mate: debug
