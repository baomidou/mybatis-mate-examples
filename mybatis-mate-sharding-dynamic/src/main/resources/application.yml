# Mybatis Mate 配置
mybatis-mate:
  cert:
    # 请添加微信wx153666购买授权，不白嫖从我做起！ 测试证书会失效，请勿正式环境使用
    grant: thisIsTestLicense
    license: 
# 采用代码初始化，这里注释即可，需要健康检测启动的时候需要配置 yml 初始化数据源
  sharding:
#    health: true # 健康检测
    primary: mysql # 默认选择数据源，该项配置必须有否则无法加载启动
    datasource:
      mysql:
        - key: t1
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/test?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          username: root
          schema: test

# 允许bean定义重写
spring:
  main:
    allow-bean-definition-overriding: true

# 配置健康检查
management:
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: false
    db:
      enabled: true

# Logger Config
logging:
  level:
    mybatis.mate: debug
    org.apache: debug
